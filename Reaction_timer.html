<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction-timer</title>
    <script>
        let startTime;
        let endTime;

        function startTimer() {
            document.getElementById('startButton').disabled = true;
            document.getElementById('message').innerText = "Wait for the signal...";
            const randomDelay = Math.random() * 3000 + 2000;
            setTimeout(() => {
                document.getElementById('message').innerText = "Click now!";
                startTime = new Date().getTime();
                document.getElementById('clickButton').disabled = false;
            }, randomDelay);
        }

        function recordReaction() {
            endTime = new Date().getTime();
            const reactionTime = endTime - startTime;
            document.getElementById('result').innerText = `Your reaction time is: ${reactionTime} ms`;
            document.getElementById('clickButton').disabled = true;
            document.getElementById('startButton').disabled = false;
        }
    </script>
</head>
<body>
    <h1>Reaction Timer</h1>
    <p id="message">Start</p>
    <button id="startButton" onclick="startTimer()">Start</button>
    <button id="clickButton" onclick="recordReaction()" disabled>Click</button>
    <p id="result"></p>
</body>
</html>
