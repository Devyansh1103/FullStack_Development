<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: repeat(3, 1fr) ;
            gap:3%;
            padding: 10px;
            grid-template-areas: 
                "Box1 Box1 Box2"
                "Box1 Box1 Box3"
                "Box4 Box4 Box5"               
                "Box6 Box7 Box8"
                "Box9 Box9 Box9"
                ;
        }
        .box{
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="box" style="grid-area: Box1;">Box 1</div>
        <div class="box" style="grid-area: Box2;">Box 2</div>
        <div class="box" style="grid-area: Box3;">Box 3</div>
        <div class="box" style="grid-area: Box4;">Box 4</div>
        <div class="box" style="grid-area: Box5;">Box 5</div>
        <div class="box" style="grid-area: Box6;">Box 6</div>
        <div class="box" style="grid-area: Box7;">Box 7</div>
        <div class="box" style="grid-area: Box8;">Box 8</div>
        <div class="box" style="grid-area: Box9;">Box 9</div>
    </div>
</body>
</html>
