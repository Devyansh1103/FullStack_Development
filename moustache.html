<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            background: #f5eadb;
        }

        .moustache {
            position: relative;
            width: 360px;
            height: 150px;
        }

        .moustache::before,
        .moustache::after {
            position: absolute;
            top: 35px;
            width: 175px;
            height: 95px;
            background: #2b211d;
            content: "";
        }

        .moustache::before {
            right: 50%;
            border-radius: 100% 0 100% 20%;
            transform: rotate(18deg);
            transform-origin: right bottom;
        }

        .moustache::after {
            left: 50%;
            border-radius: 0 100% 20% 100%;
            transform: rotate(-18deg);
            transform-origin: left bottom;
        }
    </style>
</head>
<body>
    <div class="moustache" aria-label="A CSS moustache"></div>
</body>
</html>
