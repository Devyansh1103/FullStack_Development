<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Gradient</title>
    <style>
        #box{
            width: 500px;
            height: 500px;
            margin-top: 100px;
            margin-left: 30%;
            background: linear-gradient(45deg,white ,green , red,white );
            border-radius: 20px;
            padding: 2px;
            
        }
        
        #box1{
            width:460px;
            height:460px;
            margin-top: 25px;
            margin-left: 25px;
            border-radius: 20px;
            font-size: 100px;
            text-align: center;
            background:linear-gradient(white,rgb(0, 42, 255));
            background-clip: text;
            color:transparent;
            font-weight: 700;
        }
        *{
            background: black;
        }
    </style>
</head>
<body>
    <div id="box">
        <div id="box1">Box</div>
    </div>

</body>
</html>
