<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:not(:hover){
            color:rgb(210, 108, 19);
        }
        li{
            font-size: 30px;
        }
        div:is(h2,h3){
            background-color: black;
            color: white;
        }
        div:has(:not(h2)){
            background-color: lightgray;
        }
        div:has(h2){
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <p>Lorem Ipsum</p>
    </div>
    <div>
        <h2>Heading</h2>
        <div>
            <h3>Heading </h3>
        </div>
    </div>
    
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
    </ul>
</body>
</html>
