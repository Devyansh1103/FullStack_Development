<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: "Masking Renta";
            src: url("./masking-renta-font/MaskingRenta.otf");
        }
        *{
            font-family: "Masking Renta";
            margin: 0;
            padding: 0;
        }
        #ID{
            color: red;
            font-size: 30px;
        }
        .class{
            color: blue;
            font-size: 20px;
        }
        input[type="email"]{
            width: 300px;
            height: 30px;
            border-radius: 5px;
        }
        input[type="password"]{
            width: 300px;
            height: 30px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2 id="ID">Selectors</h2>
    <ul>
        <li class="class">Universal Selector</li>
        <li class="class">Element Selector</li>
        <li class="class">Class Selector</li>
        <li class="class">ID Selector</li>
    </ul>
    <input type="email" placeholder="Email"><br>
    <input type="password" placeholder="Password">
</body>
</html>
